# Replay a recorded glove wrist trajectory (MCAP) on the orcabot_yaw
# embodiment (OpenArm through joint6 + printed adapter + ORCA hand,
# 7 joints per arm) in MuJoCo.
#
# The model is generated by scripts/build_orcabot_yaw_scene.py from the
# canonical URDF in the orca_arm repo; it renames the ORCA wrist-flex joints
# to openarm_*_joint7 so the stock enactic IK/viewer nodes work unchanged
# (fingers are frozen by the IK node's DofFreezingTask; the gripper channel
# drives inert dummy joints).
#
# IK tracks the right carpals body — the ORCA hand's anatomical-wrist
# analog, matching the recording's fused wrist frame directly.
# --rot-offset-euler is derived analytically from the V1-calibrated offset
# composed with the model link7->carpals rotation at the elbow-90
# correspondence pose (see build_orcabot_yaw_scene.py), and validated
# offline on session_2026-07-22_15-47-57: 3.2mm mean / 0.5mm median
# position, 0.02 deg mean orientation over the 67s clip
# (scripts/validate_wrist_offset.py).
#
# Per-run inputs (file, clip window, hand) come from REPLAY_* env vars:
#   REPLAY_MCAP=/path/to/recording.mcap REPLAY_START_SEC=30 REPLAY_END_SEC=40 \
#     uv run dora run config/dataflow-mujoco-yaw-replay.yaml --uv

nodes:
  - id: replayer
    path: ../scripts/mcap_wrist_replay.py
    # --gripper 0: the yaw model has no gripper; the channel moves inert
    # dummy joints only.
    args: "--calibration frame_calibration.json --rot-offset-euler -50.307 85.797 156.518 --gripper 0"
    outputs:
      - pose_right

  - id: ik
    build: pip install git+https://github.com/enactic/dora-openarm-kinematics
    path: dora-openarm-ik
    args: "--mode right --max-iters 10 --dt 0.1 --damping 0.1 --posture-cost 0.01 --lm-damping 0.01 --xml ../models/orcabot_yaw/scene.xml --frame-right orcahand_right_R-Carpals_8d1f1041 --frame-type-right body --frame-left orcahand_left_L-Carpals_719fff8c --frame-type-left body"
    inputs:
      target_right: replayer/pose_right
    outputs:
      - position_left
      - position_right
      - status

  - id: mujoco-viewer
    build: pip install git+https://github.com/enactic/dora-openarm-mujoco
    path: dora-openarm-mujoco
    args: "--xml ../models/orcabot_yaw/scene.xml --keyframe home --viewer --debug-frames"
    inputs:
      position_left:  ik/position_left
      position_right: ik/position_right
      pose_right:     replayer/pose_right
    outputs:
      - status
