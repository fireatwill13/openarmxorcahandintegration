[project]
name = "orca-retarget"
version = "0.1.0"
description = "Bridge: recorded/live hand keypoints -> ORCA finger joints for the orcabot_yaw embodiment (offline replay sidecars now, dora teleop node later)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "orca_teleop[adaptive]",
    "mcap>=1.0",
    "numpy>=2.0",
]

[tool.uv.sources]
orca_teleop = { path = "/home/alex/based/orca_teleop", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orca_retarget"]
